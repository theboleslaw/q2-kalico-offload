# Keeps the Klipper and Happy Hare pins current in this repository. Runs every day and
# commits VERSIONS only when a newer Klipper or Happy Hare passes the patch check.
# Needs the bundle at the repository root (q2-klipper/ next to this folder).
name: Update upstream pins

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Klipper and Happy Hare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "q2-klipper-bot"
          git config user.email "q2-klipper-bot@users.noreply.github.com"
          q2-klipper/scripts/update-upstream.sh --push

