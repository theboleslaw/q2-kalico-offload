# Shared by the Mainsail server (Q2 Klipper)
location /websocket {
    proxy_pass http://q2_klipper_moonraker/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $q2_klipper_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
}

location ~ ^/(printer|api|access|machine|server)/ {
    proxy_pass http://q2_klipper_moonraker$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
}

# Box drying page (web/box)
location = /box {
    return 301 /box/;
}
location /box/ {
    alias @HOME@/printer_data/web/box/;
    add_header Cache-Control "no-cache";
}
