# Q2 Klipper: Mainsail on :80, plus the Box page under /box/.
# Generated by install-klipper.sh -- local edits are overwritten on update.
# Names are prefixed: KIAUH installs of Mainsail leave conf.d/upstreams.conf
# (upstream apiserver) and conf.d/common_vars.conf ($connection_upgrade) behind.

map $http_upgrade $q2_klipper_connection_upgrade {
    default upgrade;
    '' close;
}

upstream q2_klipper_moonraker {
    ip_hash;
    server 127.0.0.1:7125;
}

server {
    listen @MAINSAIL_PORT@ default_server;
    root @HOME@/mainsail;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    include /etc/nginx/q2-klipper-common.conf;
}
