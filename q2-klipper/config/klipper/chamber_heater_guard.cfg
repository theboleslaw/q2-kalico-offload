# Chamber heater guard. Keeps the heater element (Chamber_Thermal_Protection_Sensor, on the heater)
# below its limit while the chamber air (heater_generic chamber, control sensor on the chamber) warms
# up to the requested target. Works like the Box heat guard: the heater target is throttled as the
# element approaches element_limit, so the air still reaches the target. Above element_hard_limit the
# chamber heater is stopped, before Klipper's 130 C shutdown on the protection sensor.
# Set the target as before: SET_HEATER_TEMPERATURE HEATER=chamber TARGET=..., or M141 / M191.

[gcode_macro _CHAMBER_HEATER_GUARD_VARS]
variable_element_sensor: 'temperature_sensor Chamber_Thermal_Protection_Sensor'
variable_element_limit: 116       # C, element is held at about this value
variable_element_band: 5          # C below the limit that counts as "near the limit" (message only)
variable_element_hard_limit: 126  # C, above this the chamber heater is stopped (Klipper shuts down at 130)
variable_element_margin: 2.0      # C, the element is parked this far below the limit
variable_min_lead: 0.2            # C, lowest lead while heating
variable_max_lead: 1.5            # C, highest lead above air
variable_ki: 0.01                 # lead change per tick per C of headroom
variable_ki_down: 0.08            # lead change per tick per C over the margin
variable_max_up: 0.1              # C per tick, fastest lead increase
variable_max_down: 0.6            # C per tick, fastest lead decrease
variable_cut_over: 2.0            # C over the limit where the lead drops to zero
variable_lead: 0.5                # current lead above air (runtime state)
variable_requested_target: 0
variable_max_air: 0             # C, cached configured maximum (set once at startup)
variable_applied_target: 0
variable_throttled: False
gcode:

[delayed_gcode _CHAMBER_HEATER_GUARD_INIT]
initial_duration: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=max_air VALUE={printer.configfile.settings.get('heater_generic chamber', {}).get('max_temp', 70) | float}

[delayed_gcode _CHAMBER_HEATER_GUARD]
initial_duration: 5
gcode:
    {% set v = printer["gcode_macro _CHAMBER_HEATER_GUARD_VARS"] %}
    {% if v.element_sensor not in printer or 'heater_generic chamber' not in printer %}
        RESPOND TYPE=error MSG="Chamber heater guard: required sensor/heater missing, retrying in 5s"
        UPDATE_DELAYED_GCODE ID=_CHAMBER_HEATER_GUARD DURATION=5
    {% else %}
    {% set hot = printer[v.element_sensor].temperature %}
    {% set heater = printer["heater_generic chamber"] %}
    {% set target = heater.target %}
    {% set air = heater.temperature %}
    {% set max_air = v.max_air if v.max_air > 0 else printer.configfile.settings.get('heater_generic chamber', {}).get('max_temp', 70) | float %}
    {% set ns = namespace(req=v.requested_target) %}
    # A target that is not the one we wrote was set by someone else: treat it as a new request,
    # but never allow the remembered request to exceed the heater's configured maximum.
    {% if (target - v.applied_target) | abs > 0.3 %}
        {% set ns.req = [target, max_air] | min %}
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=requested_target VALUE={ns.req}
        {% if target > max_air %}
            RESPOND TYPE=error MSG="Chamber heater guard: requested air target {target|round(1)} C exceeds configured maximum {max_air|round(1)} C; clamped"
        {% endif %}
    {% else %}
        {% set ns.req = [ns.req, max_air] | min %}
    {% endif %}
    {% if hot > v.element_hard_limit and (target > 0 or ns.req > 0) %}
        RESPOND TYPE=error MSG="Chamber heater guard: element at {hot|round(1)} C (limit {v.element_hard_limit} C), heater stopped"
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=requested_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=applied_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=lead VALUE=0.5
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% elif ns.req > 0 %}
        {% set lim = v.element_limit %}
        {% set gap = ns.req - air %}
        {% set err = (lim - v.element_margin) - hot %}
        {% set delta = ([err * v.ki, v.max_up] | min) if err >= 0 else ([err * v.ki_down, 0 - v.max_down] | max) %}
        {% set lead = ([[v.lead + delta, v.max_lead, gap + 0.5] | min, v.min_lead] | max) if gap > 0 else v.lead %}
        # Element well over the limit: no lead at all, the heater target sits just under the air
        {% set cut = hot > lim + v.cut_over %}
        {% set eff = ((air - 0.5) if cut else ([air + lead, ns.req] | min if gap > 0 else ns.req)) | round(1) %}
        {% if (lead | round(2) - v.lead) | abs >= 0.005 %}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=lead VALUE={lead | round(2)}
        {% endif %}
        {% if (eff - target) | abs >= 0.2 %}
            SET_HEATER_TEMPERATURE HEATER=chamber TARGET={eff}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=applied_target VALUE={eff}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=applied_target VALUE={target}
        {% endif %}
        {% set holding = gap > 0 and hot > lim - v.element_band and eff < ns.req - 0.5 %}
        {% if holding and not v.throttled %}
            RESPOND MSG="Chamber heater guard: element at {hot|round(1)} C, holding it near {lim|int} C (air {air|round(1)} C, target {ns.req|int} C)"
            SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=throttled VALUE=True
        {% elif not holding and v.throttled %}
            SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        {% endif %}
    {% elif v.applied_target != 0 or v.throttled %}
        # Heater stopped from outside, forget the request
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=applied_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        SET_GCODE_VARIABLE MACRO=_CHAMBER_HEATER_GUARD_VARS VARIABLE=lead VALUE=0.5
    {% endif %}
    # IMPORTANT: delayed_gcode runs once unless it schedules itself again.
    UPDATE_DELAYED_GCODE ID=_CHAMBER_HEATER_GUARD DURATION=1
    {% endif %}
