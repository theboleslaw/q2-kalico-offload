# Qidi Box: MMU_KEEP_DRY humidity watchdog + print heating + element heat guard (single file,
# replaces mmu_keep_dry.cfg, which was a duplicate of the first section below).
#
# Keep the Qidi Box dry. Happy Hare only runs timed drying cycles
# (MMU_HEATER DRY=1); this re-arms a cycle whenever the Box humidity rises.
# It is OFF after every Klipper start/reboot, so turn it on manually.
# No cycle is started when no gate holds a spool.
# Temperature: TARGET if set, otherwise the lowest drying_data entry of the loaded gates.
# Either way it is capped by heater_max_temp (90).
#   MMU_KEEP_DRY                                   -> status
#   MMU_KEEP_DRY ENABLE=0|1                        -> stop / resume the watchdog
#   MMU_KEEP_DRY ENABLE=1 TARGET=50 INTERVAL=2     -> resume, 50 C, rotate spools every 2 min
#   MMU_KEEP_DRY TARGET=0                          -> back to automatic temperature
#   MMU_KEEP_DRY INTERVAL=0                        -> rotation off (sends ROTATE=0, overriding heater_rotate_interval)
#   MMU_KEEP_DRY TRIGGER_HUMIDITY=35 TARGET_HUMIDITY=25  -> humidity start / stop levels
# TARGET and INTERVAL apply from the next drying cycle the watchdog starts.
# If a cycle started by this watchdog is stopped early (MMU_HEATER STOP=1), the watchdog
# switches itself off instead of re-arming.

[gcode_macro MMU_KEEP_DRY]
description: Re-arm Box drying when humidity rises above TRIGGER_HUMIDITY, dry down to TARGET_HUMIDITY
variable_enable: False          # off after boot, use MMU_KEEP_DRY ENABLE=1 to start it
variable_trigger_humidity: 35   # % RH that starts a drying cycle
variable_target_humidity: 25    # % RH that ends it (MMU_HEATER HUMIDITY=)
variable_target: 0              # C for the drying cycle, 0 = automatic (drying_data)
variable_rotate_interval: 0     # minutes between spool rotations (MMU_HEATER INTERVAL=), 0 = no rotation
variable_check_interval: 900    # s between humidity checks
variable_margin: 3              # % RH above target humidity still counted as "finished normally"
variable_cycle: False           # True while a cycle started by this watchdog is expected to run
variable_unit_section: 'mmu_unit_parameters unit0'
gcode:
    {% set v = printer["gcode_macro MMU_KEEP_DRY"] %}
    {% set max_temp = printer.configfile.settings.get(v.unit_section, {}).get('heater_max_temp', 90) | float %}
    {% if params.ENABLE is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=enable VALUE={params.ENABLE|int != 0}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=cycle VALUE=False
        {% if params.ENABLE|int == 0 %}
            UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION=0
        {% else %}
            UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION=1
        {% endif %}
    {% endif %}
    {% if params.TRIGGER_HUMIDITY is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=trigger_humidity VALUE={params.TRIGGER_HUMIDITY|float}
    {% endif %}
    {% if params.TARGET_HUMIDITY is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=target_humidity VALUE={params.TARGET_HUMIDITY|float}
    {% endif %}
    {% if params.TARGET is defined %}
        {% if params.TARGET|float > max_temp %}
            RESPOND MSG="Keep dry: TARGET {params.TARGET} C is above the Box limit, using {max_temp|int} C"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=target VALUE={[params.TARGET|float, max_temp] | min}
    {% endif %}
    {% if params.INTERVAL is defined %}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=rotate_interval VALUE={params.INTERVAL|int}
    {% endif %}
    {% set ns = namespace(spools=0) %}
    {% for g in range(printer.mmu.gate_status | length) %}
        {% if printer.mmu.gate_status[g] != 0 %}
            {% set ns.spools = ns.spools + 1 %}
        {% endif %}
    {% endfor %}
    {% set rh = printer["aht10 unit0_Env"].humidity %}
    {% set drying = "active" in printer.mmu.drying_state %}
    {% set en = params.ENABLE|int if params.ENABLE is defined else v.enable|int %}
    {% set t = [params.TARGET|float, max_temp] | min if params.TARGET is defined else v.target %}
    {% set ri = params.INTERVAL|int if params.INTERVAL is defined else v.rotate_interval %}
    {% set state = "on" if en else "off" %}
    {% set cycle = "running" if drying else "idle" %}
    {% set temp_txt = (t|int ~ " C") if t > 0 else "auto" %}
    {% set rot_txt = ("every " ~ ri ~ " min") if ri > 0 else "off" %}
    RESPOND MSG="Keep dry: {state}, humidity {rh}%, start above {params.TRIGGER_HUMIDITY|default(v.trigger_humidity)}%, stop at {params.TARGET_HUMIDITY|default(v.target_humidity)}%, temperature {temp_txt}, rotation {rot_txt}, spools {ns.spools}, drying cycle {cycle}"

# No initial_duration: the loop does not start by itself after a reboot.
[delayed_gcode _MMU_KEEP_DRY_LOOP]
gcode:
    {% set v = printer["gcode_macro MMU_KEEP_DRY"] %}
    {% if 'aht10 unit0_Env' not in printer or 'mmu' not in printer %}
        RESPOND TYPE=error MSG="Keep dry: required sensor/MMU missing, retrying in 5min"
        UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION=300
    {% else %}
    {% set rh = printer["aht10 unit0_Env"].humidity %}
    {% set drying = "active" in printer.mmu.drying_state %}
    {% set ns = namespace(keep=v.enable, gates=[]) %}
    # Gates that hold a spool
    {% for g in range(printer.mmu.gate_status | length) %}
        {% if printer.mmu.gate_status[g] != 0 %}
            {% set ns.gates = ns.gates + [g] %}
        {% endif %}
    {% endfor %}
    {% if v.enable and v.cycle and not drying %}
        # The cycle we started is gone
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=cycle VALUE=False
        {% if rh > v.target_humidity + v.margin %}
            # Humidity never reached the target, so it was stopped by hand: switch off
            {% set ns.keep = False %}
            SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=enable VALUE=False
            RESPOND MSG="Keep dry: drying was stopped early, watchdog switched off (MMU_KEEP_DRY ENABLE=1 to resume)"
        {% endif %}
    {% elif v.enable and printer.mmu.enabled and not drying and rh > v.trigger_humidity and ns.gates | length > 0 %}
        {% set temp_p = (" TEMP=" ~ v.target) if v.target > 0 else "" %}
        {% set rot_p = (" ROTATE=1 GATES=" ~ (ns.gates | join(',')) ~ " INTERVAL=" ~ v.rotate_interval) if v.rotate_interval > 0 else " ROTATE=0" %}
        RESPOND MSG="Keep dry: humidity {rh}% > {v.trigger_humidity}%, starting a drying cycle down to {v.target_humidity}% (MMU_HEATER DRY=1{temp_p}{rot_p})"
        MMU_HEATER DRY=1{temp_p}{rot_p} HUMIDITY={v.target_humidity}
        SET_GCODE_VARIABLE MACRO=MMU_KEEP_DRY VARIABLE=cycle VALUE=True
    {% endif %}
    {% if ns.keep %}
        UPDATE_DELAYED_GCODE ID=_MMU_KEEP_DRY_LOOP DURATION={v.check_interval}
    {% endif %}
    {% endif %}

# Heat the Box while printing, like the stock Qidi firmware: print_temps is Qidi's
# officiall_filas_list box_max_temp (0 = no heating).
# Same materials as Happy Hare drying_data (overrides.cfg), which drying cycles use. With
# several materials loaded the lowest one wins so a PLA spool next to a PETG one does not
# soften. Capped by Happy Hare heater_max_temp. A drying cycle already running is left alone.
#   PRINT_START calls _BOX_PRINT_HEAT, PRINT_END / CANCEL_PRINT call DISABLE_BOX_HEATER.
[gcode_macro _BOX_PRINT_HEAT]
description: Set the Box heater for the materials of this print (stock Qidi behaviour)
variable_enable: True
variable_unit_section: 'mmu_unit_parameters unit0'
variable_print_temps: {
    'PLA': 0, 'PLA+': 0, 'PLA-CF': 0, 'PLA-S': 0, 'PLA-WOOD': 45, 'PETG': 45,
    'PETG-CF': 45, 'PETG-GF': 45, 'TPU': 0, 'TPEE': 0, 'PEBA': 0, 'ASA': 45,
    'ASA-CF': 45, 'ASA-AERO': 45, 'ABS': 55, 'ABS+': 55, 'ABS-GF': 55, 'PC': 0,
    'PC-ABS': 50, 'PC-ABS-FR': 50, 'PET-GF': 50, 'PET-CF': 65, 'PVA': 50, 'HIPS': 0,
    'NYLON': 55, 'PA': 55, 'ULTRAPA': 55, 'PA-CF': 65, 'PA12-CF': 65, 'ULTRAPA-CF25': 65,
    'PA-S': 65, 'PAHT-CF': 65, 'PAHT-GF': 65, 'PAHT-S': 65, 'PPS-CF': 65, 'PPS-GF': 65 }
variable_active: False
gcode:
    {% set v = printer["gcode_macro _BOX_PRINT_HEAT"] %}
    {% set mmu = printer.mmu %}
    {% set slicer = (params.TOOL_MATERIALS | default('')).upper().split(',') %}
    {% set tools = (params.REFERENCED_TOOLS | default('')).split(',') %}
    {% set ns = namespace(materials=[], temp=999, why=[]) %}
    # Every gate holding filament, plus the slicer material of each tool the print uses
    {% for g in range(mmu.gate_status | length) %}
        {% if mmu.gate_status[g] != 0 %}
            {% set ns.materials = ns.materials + [mmu.gate_material[g] | default('', true) | upper | trim] %}
        {% endif %}
    {% endfor %}
    {% for t in tools %}
        {% set i = t | trim | int(-1) %}
        {% if 0 <= i < slicer | length %}
            {% set ns.materials = ns.materials + [slicer[i] | trim] %}
        {% endif %}
    {% endfor %}
    {% for m in ns.materials | unique %}
        {% set base = m.replace('+', '').replace(' ', '-').split('-')[0] %}
        {% set t = v.print_temps.get(m, v.print_temps.get(base, 0)) %}
        {% if m not in v.print_temps and base not in v.print_temps %}
            {% set ns.why = ns.why + [(m or 'unknown') ~ '=0 (not in table)'] %}
        {% else %}
            {% set ns.why = ns.why + [m ~ '=' ~ t] %}
        {% endif %}
        {% set ns.temp = [ns.temp, t] | min %}
    {% endfor %}
    {% set max_temp = printer.configfile.settings.get(v.unit_section, {}).get('heater_max_temp', 90) | float %}
    {% set temp = 0 if ns.temp == 999 else [ns.temp, max_temp] | min %}
    {% if not v.enable %}
        RESPOND MSG="Box print heat: disabled"
    {% elif "active" in mmu.drying_state %}
        RESPOND MSG="Box print heat: drying cycle running, left as is"
    {% elif temp > 0 %}
        RESPOND MSG="Box print heat: {temp|int} C ({ns.why | join(', ')})"
        MMU_HEATER TEMP={temp}
        SET_GCODE_VARIABLE MACRO=_BOX_PRINT_HEAT VARIABLE=active VALUE=True
    {% else %}
        RESPOND MSG="Box print heat: off ({ns.why | join(', ') or 'no material'})"
    {% endif %}

[gcode_macro DISABLE_BOX_HEATER]
description: Stop the Box print heating (a drying cycle keeps running)
gcode:
    {% if printer["gcode_macro _BOX_PRINT_HEAT"].active %}
        SET_GCODE_VARIABLE MACRO=_BOX_PRINT_HEAT VARIABLE=active VALUE=False
        {% if "active" not in printer.mmu.drying_state %}
            MMU_HEATER STOP=1
        {% endif %}
    {% endif %}

# Second control loop, like the stock firmware: the heater regulates on the air sensor, so the
# elements run far hotter than the air. Instead of switching the heater off when an element gets
# too hot, the guard THROTTLES it: below (element_limit - element_band) the heater runs at full
# request, then the effective target is pulled down towards the current air temperature as the
# hottest element approaches element_limit. At the limit the heater only gets the little power
# that keeps the element where it is, so the element temperature stays stable while the Box air
# keeps warming up to the requested target. It is never switched off for reaching the limit.
# Above element_hard_limit (sensor or heater fault), everything is stopped. The guard rechecks every second.
# GENTLE DRYING: while a drying cycle runs the guard is more conservative to keep power draw low:
# a lower element limit (dry_element_limit), a wider throttle band (dry_element_band) and a
# "soft ramp" (dry_max_lead): the heater target is never more than dry_max_lead C above the
# current air temperature, so the PID asks for modest power instead of full power. The air still
# reaches the requested target, just slower. Print heating keeps the normal limits. Set
# dry_max_lead to 0 to disable the soft ramp.
# The requested target (what Happy Hare / print heating / you asked for) is remembered in
# requested_target; Mainsail shows the throttled value while the guard is holding back.
# A target set by hand is handled the same way. MMU_HEATER STOP=1 / TEMP=0 clears it.
[gcode_macro _BOX_HEATER_GUARD_VARS]
variable_unit_section: 'mmu_unit_parameters unit0'
variable_element_limit: 78        # C, hottest element is held at about this value (print heating)
variable_element_band: 6          # C below the limit that counts as "near the limit" (message only)
variable_dry_element_limit: 78    # C, same, while a drying cycle runs
variable_dry_element_band: 8      # C, same, while drying
variable_dry_max_lead: 1.0        # C, max lead above air while drying (0 = use max_lead)
variable_element_hard_limit: 95   # C, above this everything is stopped (fault)
variable_element_margin: 2.0      # C, the element is parked this far below the limit
variable_min_lead: 0.2            # C, lowest lead while heating
variable_max_lead: 1.5            # C, highest lead (1 C is about 25% power with Kp 63)
variable_ki: 0.01                 # lead change per tick per C of headroom (raise = faster ramp)
variable_ki_down: 0.08            # lead change per tick per C over the margin (raise = harder braking)
variable_max_up: 0.1              # C per tick, fastest lead increase
variable_max_down: 0.6            # C per tick, fastest lead decrease
variable_cut_over: 2.0            # C over the limit where the lead drops to zero
variable_lead: 0.5                # current lead above air (runtime state)
variable_requested_target: 0
variable_applied_target: 0
variable_throttled: False
variable_max_air: 0             # C, cached Box heater max_temp (set once at startup)
gcode:

[delayed_gcode _BOX_HEATER_GUARD_INIT]
initial_duration: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=max_air VALUE={printer.configfile.settings.get('mmu_unit_parameters unit0', {}).get('heater_max_temp', 90) | float}

[delayed_gcode _BOX_HEATER_GUARD]
initial_duration: 5
gcode:
    {% set v = printer["gcode_macro _BOX_HEATER_GUARD_VARS"] %}
    {% if 'temperature_sensor unit0_heater_temp_a' not in printer or 'temperature_sensor unit0_heater_temp_b' not in printer or 'heater_generic unit0_heater' not in printer or 'mmu' not in printer %}
        RESPOND TYPE=error MSG="Box heater guard: required sensor/heater missing, retrying in 5s"
        UPDATE_DELAYED_GCODE ID=_BOX_HEATER_GUARD DURATION=5
    {% else %}
    {% set hot = [printer["temperature_sensor unit0_heater_temp_a"].temperature,
                  printer["temperature_sensor unit0_heater_temp_b"].temperature] | max %}
    {% set heater = printer["heater_generic unit0_heater"] %}
    {% set target = heater.target %}
    {% set air = heater.temperature %}
    {% set drying = "active" in printer.mmu.drying_state %}
    {% set max_air = v.max_air if v.max_air > 0 else printer.configfile.settings.get(v.unit_section, {}).get('heater_max_temp', 90) | float %}
    {% set ns = namespace(req=v.requested_target) %}
    # A target that is not the one we wrote was set by someone else: treat it as a new request,
    # but never allow the remembered request to exceed the Box heater's configured maximum.
    {% if (target - v.applied_target) | abs > 0.3 %}
        {% set ns.req = [target, max_air] | min %}
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=requested_target VALUE={ns.req}
        {% if target > max_air %}
            RESPOND TYPE=error MSG="Box heater guard: requested air target {target|round(1)} C exceeds configured maximum {max_air|round(1)} C; clamped"
        {% endif %}
    {% else %}
        {% set ns.req = [ns.req, max_air] | min %}
    {% endif %}
    {% if hot > v.element_hard_limit and (target > 0 or ns.req > 0) %}
        RESPOND TYPE=error MSG="Box heater guard: element at {hot|round(1)} C (limit {v.element_hard_limit} C), heater stopped"
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=requested_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=applied_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=lead VALUE=0.5
        SET_GCODE_VARIABLE MACRO=_BOX_PRINT_HEAT VARIABLE=active VALUE=False
        {% if drying %}
            MMU_HEATER STOP=1
        {% endif %}
        SET_HEATER_TEMPERATURE HEATER=unit0_heater TARGET=0
    {% elif ns.req > 0 %}
        {% set lim = v.dry_element_limit if drying else v.element_limit %}
        {% set band = v.dry_element_band if drying else v.element_band %}
        {% set gap = ns.req - air %}
        {% set err = (lim - v.element_margin) - hot %}
        {% set delta = ([err * v.ki, v.max_up] | min) if err >= 0 else ([err * v.ki_down, 0 - v.max_down] | max) %}
        {% set cap = v.dry_max_lead if (drying and v.dry_max_lead > 0) else v.max_lead %}
        {% set lead = ([[v.lead + delta, cap, gap + 0.5] | min, v.min_lead] | max) if gap > 0 else v.lead %}
        # Element well over the limit: no lead at all, the heater target sits just under the air
        {% set cut = hot > lim + v.cut_over %}
        {% set eff = ((air - 0.5) if cut else ([air + lead, ns.req] | min if gap > 0 else ns.req)) | round(1) %}
        {% if (lead | round(2) - v.lead) | abs >= 0.005 %}
            SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=lead VALUE={lead | round(2)}
        {% endif %}
        {% if (eff - target) | abs >= 0.2 %}
            SET_HEATER_TEMPERATURE HEATER=unit0_heater TARGET={eff}
            SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=applied_target VALUE={eff}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=applied_target VALUE={target}
        {% endif %}
        {% set holding = gap > 0 and hot > lim - band and eff < ns.req - 0.5 %}
        {% if holding and not v.throttled %}
            RESPOND MSG="Box heater guard: element at {hot|round(1)} C, holding it near {lim|int} C (air {air|round(1)} C, target {ns.req|int} C)"
            SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=throttled VALUE=True
        {% elif not holding and v.throttled %}
            SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        {% endif %}
    {% elif v.applied_target != 0 or v.throttled %}
        # Heater stopped from outside, forget the request
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=applied_target VALUE=0
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=throttled VALUE=False
        SET_GCODE_VARIABLE MACRO=_BOX_HEATER_GUARD_VARS VARIABLE=lead VALUE=0.5
    {% endif %}
    # IMPORTANT: delayed_gcode runs once unless it schedules itself again.
    # Keep checking while idle too, so every heater start is guarded.
    UPDATE_DELAYED_GCODE ID=_BOX_HEATER_GUARD DURATION=1
    {% endif %}
